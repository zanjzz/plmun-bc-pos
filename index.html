<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123d2c" />
    <meta
      name="description"
      content="PLMun Business Center ordering, point-of-sale, and inventory management."
    />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("plmun-theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link
      id="app-favicon"
      rel="icon"
      type="image/png"
      href="/assets/plmun-favicon-light-theme.png"
    />
    <title>PLMUN - BC</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
